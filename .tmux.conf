# Only use C-g as prefix, since C-b conflicts with vim's page-up.
unbind C-b
set -g prefix C-g
# tmux-sensible binds `prefix + prefix` to reach a nested tmux.

# Force 256 color terminal
set -g default-terminal 'tmux-256color'

# Truecolor in the outer terminal. Must be -ga: -g replaces the option
# instead of appending to it.
set -ga terminal-overrides ',xterm-256color:Tc'

# Scrollback is tmux's job. The wheel enters copy-mode, as does `prefix + [`,
# where tmux-yank puts `y` on the system clipboard.
set -g mouse on

# history-limit is left to tmux-sensible, which sets 50000.

# Use Vi style key bindings
setw -g mode-keys vi

# Some systems still open new panes in bash.
set -g default-shell /bin/zsh

# Detach without uplift pinkie
bind-key C-d detach

# Vim style key bindings
bind s split-window -v
bind v split-window -h

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind < resize-pane -L 1
bind > resize-pane -R 1
bind - resize-pane -D 1
bind + resize-pane -U 1

bind : command-prompt

bind S setw synchronize-panes \; display-message "Synchronization Toggled"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'

# Initialize TMUX plugin manager (keep these lines at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
